<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stock Opname — INTEX</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 12px; }
h1 { font-size: 20px; text-align: center; margin-bottom: 4px; }
.subtitle { text-align: center; font-size: 13px; color: #666; margin-bottom: 12px; }
.card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
#reader { width: 100%; max-width: 400px; margin: 0 auto; }
#reader video { border-radius: 8px; width: 100% !important; }
.row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.row input, .row select { flex: 1; padding: 10px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; }
.row input:focus, .row select:focus { border-color: #4CAF50; outline: none; }
.row label { font-size: 14px; font-weight: bold; white-space: nowrap; color: #333; }
.btn { padding: 10px 20px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
.btn-green { background: #4CAF50; color: white; width: 100%; }
.btn-blue { background: #2196F3; color: white; }
.btn-red { background: #f44336; color: white; }
.btn-sm { padding: 6px 12px; font-size: 14px; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.info-box { margin-top: 8px; padding: 10px; border-radius: 8px; font-size: 14px; display: none; }
.info-box.ok { background: #e8f5e9; display: block; }
.info-box.err { background: #ffebee; display: block; }
.info-box.info { background: #e3f2fd; display: block; }
table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #ddd; }
th { background: #4CAF50; color: white; position: sticky; top: 0; }
.del { color: red; cursor: pointer; font-weight: bold; font-size: 16px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
.badge-green { background: #e8f5e9; color: #2e7d32; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.summary span { background: #e0e0e0; padding: 4px 12px; border-radius: 16px; font-size: 13px; }
.tab { display: flex; gap: 4px; margin-bottom: 12px; }
.tab button { flex: 1; padding: 8px; border: 2px solid #ddd; background: white; border-radius: 8px; cursor: pointer; font-size: 14px; }
.tab button.active { border-color: #4CAF50; background: #e8f5e9; font-weight: bold; }
.hidden { display: none !important; }
#status { text-align: center; font-size: 14px; color: #666; margin-top: 8px; }
.lok-name { font-size: 12px; color: #1565c0; margin-top: 4px; }
@media print { .no-print { display: none !important; } }
</style>
</head>
<body>

<h1>Stock Opname</h1>
<div class="subtitle">INTEX</div>

<!-- Lokasi -->
<div class="card">
  <div class="row">
    <label>Lokasi</label>
    <input type="text" id="lokasi_code" placeholder="Kode toko, cth: 55464" inputmode="numeric" style="flex:0.4" oninput="lookupLokasi()">
    <div id="lokasi_name" style="flex:1;font-size:14px;color:#1565c0;font-weight:bold">—</div>
    <button class="btn btn-sm btn-blue" onclick="finishLocation()" style="white-space:nowrap" title="Selesai scan toko ini & ganti toko lain">Selesai ✅</button>
  </div>
</div>

<div class="tab no-print">
  <button id="tab_scan" class="active" onclick="switchTab('scan')">Scan Kamera</button>
  <button id="tab_manual" onclick="switchTab('manual')">Input Manual</button>
</div>

<div id="panel_scan">
  <div class="card">
    <div id="reader"></div>
    <div id="status">Arahkan kamera ke barcode</div>
  </div>
</div>

<div id="panel_manual" class="hidden">
  <div class="card">
    <div class="row">
      <label>PLU</label>
      <input type="text" id="manual_code" placeholder="Kode item / barcode" onkeydown="if(event.key==='Enter')manualLookup()">
      <button class="btn btn-blue" onclick="manualLookup()">Cari</button>
    </div>
  </div>
</div>

<div class="card">
  <div id="info_bar" class="info-box"></div>
  <div class="row no-print">
    <label>Qty</label>
    <input type="text" id="qty_input" placeholder="Stok Fisik" inputmode="numeric">
  </div>
  <button class="btn btn-green no-print" onclick="saveScan()" style="margin-top:8px">Simpan</button>
</div>

<div class="card">
  <div class="summary">
    <span id="count_badge">0 item</span>
    <span id="total_badge">0 qty</span>
    <span id="lok_badge">—</span>
  </div>
  <div id="table_wrap" style="max-height:300px;overflow-y:auto"></div>
  <div class="btn-group no-print">
    <button class="btn btn-green btn-sm" onclick="exportXLSX()" style="font-weight:bold">Export Excel</button>
    <button class="btn btn-blue btn-sm" onclick="exportJSON()">Export JSON</button>
    <button class="btn btn-blue btn-sm" onclick="exportCSV()">Export CSV</button>
    <button class="btn btn-red btn-sm" onclick="clearAll()">Hapus Semua</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'opname_data';
const LOK_KEY = 'opname_lokasi';
let lastPlu = '';
let barcodeMap = {};
let namaMap = {};
let lokasiMap = {};
let lokasiKode = '';
let lokasiNama = '';

function padPlu(p) { return String(p).padStart(7, '0'); }

async function loadMaps() {
  try { let r=await fetch('barcode_map.json'); barcodeMap=await r.json(); } catch(e) {}
  try { let r=await fetch('nama_map.json'); namaMap=await r.json(); } catch(e) {}
  try { let r=await fetch('lokasi_map.json'); lokasiMap=await r.json(); } catch(e) {}
  restoreLokasi();
}
loadMaps();

function restoreLokasi() {
  const saved = localStorage.getItem(LOK_KEY);
  if (saved) {
    try {
      const p = JSON.parse(saved);
      document.getElementById('lokasi_code').value = p.kode;
      lokasiKode = p.kode;
      lokasiNama = p.nama;
      document.getElementById('lokasi_name').textContent = p.nama || '—';
      document.getElementById('lok_badge').textContent = p.kode;
    } catch(e) {}
  }
}

function lookupLokasi() {
  const code = document.getElementById('lokasi_code').value.trim();
  if (!code) {
    document.getElementById('lokasi_name').textContent = '—';
    lokasiKode = '';
    lokasiNama = '';
    document.getElementById('lok_badge').textContent = '—';
    return;
  }
  const data = getData();
  if (data.length > 0 && code !== lokasiKode) {
    if (!confirm(`Ada ${data.length} item terscan untuk ${lokasiNama || lokasiKode}.\n\nHapus data lama sebelum ganti ke toko ${code}?\nOK = hapus, Batal = biarkan tercampur`)) {
      document.getElementById('lokasi_code').value = lokasiKode;
      return;
    }
    localStorage.removeItem(STORAGE_KEY);
    renderTable();
  }
  const nama = lokasiMap[code] || lokasiMap[code.replace(/^0+/,'')] || '';
  lokasiKode = code;
  lokasiNama = nama;
  document.getElementById('lokasi_name').textContent = nama || '(kode tidak dikenal)';
  document.getElementById('lok_badge').textContent = code;
  localStorage.setItem(LOK_KEY, JSON.stringify({kode: code, nama: nama}));
}

function getData() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); renderTable(); }

function switchTab(tab) {
  document.getElementById('tab_scan').className = tab==='scan'?'active':'';
  document.getElementById('tab_manual').className = tab==='manual'?'active':'';
  document.getElementById('panel_scan').className = tab==='scan'?'':'hidden';
  document.getElementById('panel_manual').className = tab==='manual'?'':'hidden';
}

function lookupCode(code) {
  code = code.trim();
  if (!code) return null;
  let plu = barcodeMap[code];
  if (plu) return {plu, src:'barcode'};
  let s = code.replace(/^0+/, '');
  if (s !== code) { plu = barcodeMap[s]; if (plu) return {plu, src:'barcode'}; }
  if (namaMap[s]) return {plu:s, src:'plu'};
  let p = s.padStart(7, '0');
  if (namaMap[p]) return {plu:p, src:'plu'};
  return null;
}

function showInfo(type, plu, nama) {
  const el = document.getElementById('info_bar');
  el.className = 'info-box ' + type;
  el.innerHTML = type === 'ok'
    ? `<div style="font-size:18px;font-weight:bold">${padPlu(plu)}</div><div style="font-size:14px;color:#555">${nama||''}</div>`
    : `<div style="font-weight:bold">${plu||''}</div><div style="font-size:14px;color:#555">${nama||''}</div>`;
}

function manualLookup() {
  const code = document.getElementById('manual_code').value.trim();
  if (!code) return;
  const f = lookupCode(code);
  if (f) { lastPlu = f.plu; showInfo('ok', f.plu, namaMap[f.plu]||''); autoFillQty(f.plu); }
  else { showInfo('err', 'Kode: '+code, 'Tidak ditemukan. Coba ketik PLU tanpa leading zero.'); lastPlu=''; }
}

function onScanSuccess(raw) {
  const code = raw.trim();
  const f = lookupCode(code);
  if (f) { lastPlu = f.plu; showInfo('ok', f.plu, namaMap[f.plu]||''); autoFillQty(f.plu); beep(); return; }
  // Fallback: barcode mentah sebagai PLU
  const s = code.replace(/^0+/, '');
  if (namaMap[s]) { lastPlu = s; showInfo('ok', s, namaMap[s]+' (barcode)'); autoFillQty(s); beep(); return; }
  showInfo('err', 'Barcode: '+code, 'Tidak terdaftar. Input manual.');
  lastPlu = '';
  beepErr();
}

function autoFillQty(plu) {
  const d = getData();
  const e = d.find(r => r.plu === plu);
  document.getElementById('qty_input').value = e ? e.qty : '';
  document.getElementById('qty_input').focus();
}

function saveScan() {
  if (!lastPlu) { alert('Scan / cari barang dulu!'); return; }
  const qty = document.getElementById('qty_input').value.trim();
  if (!qty || isNaN(qty)) { alert('Isi stok fisik (angka)!'); return; }
  const data = getData();
  const i = data.findIndex(r => r.plu === lastPlu);
  const item = { plu: lastPlu, nama: namaMap[lastPlu]||'', qty: qty, lokasi_kode: lokasiKode, lokasi_nama: lokasiNama, ts: new Date().toISOString() };
  if (i >= 0) { data[i] = item; } else { data.push(item); }
  saveData(data);
  document.getElementById('qty_input').value = '';
  document.getElementById('info_bar').className = 'info-box';
  if (document.getElementById('manual_code')) document.getElementById('manual_code').value = '';
  lastPlu = '';
  beep();
}

function renderTable() {
  const data = getData();
  document.getElementById('count_badge').textContent = data.length + ' item';
  document.getElementById('total_badge').textContent = data.reduce((s,r) => s+(parseInt(r.qty)||0), 0) + ' qty';
  if (data.length === 0) { document.getElementById('table_wrap').innerHTML = '<p style="color:#999;text-align:center;padding:20px">Belum ada scan</p>'; return; }
  let h = '<table><thead><tr><th>PLU</th><th>Nama</th><th>Qty</th><th>Lokasi</th><th class="no-print"></th></tr></thead><tbody>';
  data.forEach((r,i) => { h += `<tr><td>${padPlu(r.plu)}</td><td style="font-size:12px">${r.nama||'-'}</td><td>${r.qty}</td><td style="font-size:11px">${r.lokasi_kode||'-'}</td><td class="no-print"><span class="del" onclick="delRow(${i})">x</span></td></tr>`; });
  h += '</tbody></table>';
  document.getElementById('table_wrap').innerHTML = h;
}

function delRow(i) { const d=getData(); d.splice(i,1); saveData(d); }
function clearAll() { if (confirm('Hapus semua?')) { localStorage.removeItem(STORAGE_KEY); renderTable(); } }

function finishLocation() {
  const data = getData();
  const total = data.reduce((s,r) => s+(parseInt(r.qty)||0), 0);
  const label = lokasiNama || 'Toko';
  const kode = lokasiKode;

  if (data.length > 0) {
    if (confirm(`Selesai: ${label} (${kode})\nItem: ${data.length}  Qty: ${total}\n\nOK = Export Excel dulu, lalu hapus.\nBatal = Hanya hapus, tanpa export.`)) {
      exportXLSX();
    }
  }

  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('lokasi_code').value = '';
  document.getElementById('lokasi_name').textContent = '—';
  lokasiKode = ''; lokasiNama = '';
  document.getElementById('lok_badge').textContent = '—';
  localStorage.removeItem(LOK_KEY);
  renderTable();
  document.getElementById('lokasi_code').focus();
}

function exportXLSX() {
  const data = getData();
  if (data.length === 0) { alert('Belum ada data!'); return; }
  const rows = data.map(r => ({
    'PLU': padPlu(r.plu),
    'Nama Barang': r.nama || '',
    'Stok Fisik': parseInt(r.qty) || 0,
    'Kode Lokasi': r.lokasi_kode || '',
    'Nama Lokasi': r.lokasi_nama || '',
    'Tgl Scan': r.ts || ''
  }));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:10},{wch:40},{wch:10},{wch:12},{wch:30},{wch:25}];
  XLSX.utils.book_append_sheet(wb, ws, 'Opname');
  XLSX.writeFile(wb, `opname_${lokasiKode || 'hasil'}.xlsx`);
}

function exportJSON() {
  const data = getData().map(r => ({...r, plu_padded: padPlu(r.plu)}));
  const blob = new Blob([JSON.stringify({exported:new Date().toISOString(), lokasi:{kode:lokasiKode,nama:lokasiNama}, items:data}, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='opname_hasil.json'; a.click();
}
function exportCSV() {
  let csv = 'PLU,PLU_7DIGIT,Nama Barang,Qty,Kode Lokasi,Nama Lokasi,Tgl Scan\n';
  getData().forEach(r => { csv += `${r.plu},${padPlu(r.plu)},${(r.nama||'').replace(/,/g,' ')},${r.qty},${r.lokasi_kode||''},${r.lokasi_nama||''},${r.ts}\n`; });
  const a = document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='opname_hasil.csv'; a.click();
}

function beep() { try { const c=new AudioContext(), o=c.createOscillator(); o.frequency.value=800; o.connect(c.destination); o.start(); setTimeout(()=>o.stop(),150); } catch(e){} }
function beepErr() { try { const c=new AudioContext(), o=c.createOscillator(); o.frequency.value=200; o.connect(c.destination); o.start(); setTimeout(()=>o.stop(),300); } catch(e){} }

const qr = new Html5Qrcode("reader");
qr.start({facingMode:"environment"},{fps:10,qrbox:{width:300,height:200}},onScanSuccess).catch(e=>{
  document.getElementById('status').textContent='Kamera error — Gunakan Input Manual';
});

renderTable();
</script>
</body>
</html>
